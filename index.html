<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bah!, reuniões sem barreiras</title>
<style>
  :root { --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0b4a36; --bg: #fff; --zebra: #f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --accent: #5fd0a4; --bg: #0d1117; --zebra: #151b23; } }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 19px; margin: 32px 0 8px; color: var(--accent); }
  a { color: var(--accent); }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  tr:nth-child(even) td { background: var(--zebra); }
  footer { color: var(--muted); font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
<main>
<h1>Bah!, reuniões sem barreiras</h1>
<p>Extensão do Chrome que transcreve e traduz reuniões <strong>no seu computador</strong>. Nada é gravado nem enviado a servidores.</p>
<p><a href="privacidade/">Política de privacidade</a></p>
<p>Contato: <a href="mailto:nlopesapple@gmail.com">nlopesapple@gmail.com</a></p>
</main>
</body>
</html>
